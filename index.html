<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor Pro</title>
    <!-- Configuración de seguridad básica para Electron -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    
    <style>
        /* ==========================================
           1. ESTILOS GLOBALES
           ========================================== */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f3f4f6;
            overflow: hidden; /* Evita scroll en toda la ventana, se maneja por secciones */
        }

        /* ==========================================
           2. ESTILOS DEL MENÚ LATERAL (SIDEBAR)
           ========================================== */
        .sidebar {
            width: 280px;
            background-color: #1f2937; /* Gris oscuro */
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar h2 { 
            margin-top: 0; 
            font-size: 1.5rem; 
            text-align: center; 
            color: #60a5fa; /* Azul claro */
        }

        .tool-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            background: #374151; /* Fondo ligero para separar herramientas */
            padding: 12px;
            border-radius: 8px;
        }

        .tool-group label { 
            font-size: 0.85rem; 
            color: #9ca3af; 
            font-weight: bold;
            text-transform: uppercase;
        }

        button, select, input[type="file"] {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #3b82f6; /* Azul estándar */
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        button:hover { background-color: #2563eb; }
        
        select { 
            background-color: white; 
            color: #1f2937; 
            border: 1px solid #d1d5db; 
        }

        input[type="file"] { 
            background-color: #4b5563; 
            font-size: 0.8rem;
        }

        .btn-secondary { background-color: #4b5563; }
        .btn-secondary:hover { background-color: #6b7280; }

        /* ==========================================
           3. ÁREA PRINCIPAL Y CONTENEDOR DEL PDF
           ========================================== */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* AJUSTE SOLICITADO: Contenedor para que el PDF se vea completo */
        #contenedor-editor {
            position: relative;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-radius: 4px;
            /* Se adapta al 100% del espacio disponible sin salirse de la pantalla */
            width: 100%;
            height: 100%;
            max-width: 95vw;
            max-height: 95vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Corta elementos que se arrastren fuera del PDF */
        }

        #pdf-canvas {
            /* Se escala manteniendo la proporción original del documento */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Clase para los textos/imágenes que agregues dinámicamente desde JS */
        .elemento-draggable {
            position: absolute;
            cursor: move;
            user-select: none;
            /* La transición suaviza el Control+Z y el escalado */
            transition: transform 0.1s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- ==========================================
         MENÚ LATERAL (HERRAMIENTAS)
         ========================================== -->
    <div class="sidebar">
        <h2>PDF Editor Pro</h2>
        
        <!-- Grupo 1: Archivos y Elementos -->
        <div class="tool-group">
            <label>Cargar Archivos</label>
            <input type="file" id="upload-pdf" accept="application/pdf">
            <button id="btn-add-text">Añadir Texto (T)</button>
            <input type="file" id="upload-image" accept="image/png, image/jpeg, image/jpg">
        </div>

        <!-- Grupo 2: Estilos (NUEVO) -->
        <div class="tool-group">
            <label>Estilo de Letra</label>
            <select id="select-font">
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Courier New', Courier, monospace">Courier New</option>
                <option value="'Times New Roman', Times, serif">Times New Roman</option>
                <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                <option value="Verdana, sans-serif">Verdana</option>
            </select>
        </div>

        <!-- Grupo 3: Escalar Individual (NUEVO) -->
        <div class="tool-group">
            <label>Tamaño (Elemento seleccionado)</label>
            <div style="display: flex; gap: 10px;">
                <button id="btn-aumentar" style="flex: 1; font-weight: bold;">+</button>
                <button id="btn-reducir" style="flex: 1; font-weight: bold;">-</button>
            </div>
        </div>

        <!-- Pista visual de atajos -->
        <div style="font-size: 0.8rem; color: #9ca3af; text-align: center; margin-top: -10px;">
            Ctrl + Z para deshacer cambios
        </div>

        <!-- Grupo 4: Estado de Actualizaciones y GitHub (NUEVO) -->
        <div class="tool-group" style="margin-top: auto;">
            <label>Conexión a GitHub</label>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; margin-bottom: 5px;">
                <!-- El punto cambiará de color mediante app.js -->
                <span id="status-dot" style="width: 12px; height: 12px; border-radius: 50%; background: #9ca3af; display: inline-block;"></span>
                <span id="status-text" style="color: white; font-weight: 500;">Esperando estado...</span>
            </div>
            <button id="btn-actualizar" class="btn-secondary">Buscar Actualizaciones</button>
        </div>
    </div>

    <!-- ==========================================
         ÁREA DE VISUALIZACIÓN DEL PDF
         ========================================== -->
    <div class="main-content">
        <!-- Contenedor adaptativo -->
        <div id="contenedor-editor">
            <!-- El canvas donde tu script (pdf.js) renderizará el documento -->
            <canvas id="pdf-canvas"></canvas>
            
            <!-- (Los elementos como textos o imágenes se inyectarán aquí dentro mediante app.js) -->
        </div>
    </div>

    <!-- ==========================================
         LÓGICA JAVASCRIPT
         ========================================== -->
    <!-- Reemplaza la ruta si tu archivo tiene otro nombre o está en otra carpeta -->
    <script src="app.js"></script>

</body>
</html>
