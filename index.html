<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PDF Editor Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <style>
        :root {
            --bg: #f9fafb;
            --surface: #ffffff;
            --primary: #111827;
            --text: #374151;
            --border: #e5e7eb;
        }
        
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.02); z-index: 100; }
        .sidebar h2 { margin: 0; font-size: 1.25rem; color: var(--primary); font-weight: 600; letter-spacing: -0.5px; }
        .tool-group { display: flex; flex-direction: column; gap: 10px; }
        .tool-group label { font-size: 0.75rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input[type="file"] { font-size: 0.85rem; color: var(--text); }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; outline: none; transition: border 0.2s; }
        input[type="text"]:focus, input[type="number"]:focus { border-color: var(--primary); }
        
        button { background: var(--surface); border: 1px solid var(--border); padding: 10px 14px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; font-size: 0.9rem; color: var(--primary); font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover { background: #f3f4f6; }
        .btn-primary { background: var(--primary); color: white; border: none; margin-top: auto; padding: 14px; font-size: 1rem; }
        .btn-primary:hover { background: #374151; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px; overflow-y: auto; }
        .toolbar-nav { display: flex; gap: 15px; align-items: center; margin-bottom: 24px; background: var(--surface); padding: 8px 24px; border-radius: 30px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid var(--border); }
        .toolbar-nav button { border: none; background: transparent; padding: 4px 8px; }
        .toolbar-nav button:hover { background: #f3f4f6; }
        
        #contenedor-editor { position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 8px; background: white; overflow: hidden; }
        #pdf-canvas { display: block; }
        
        #parche-blanco { position: absolute; top: 200px; left: 50px; width: 150px; height: 30px; background: white; border: 2px dashed #9ca3af; overflow: hidden; display: none; cursor: move; z-index: 10; }
        
        #img-wrapper { position: absolute; top: 50px; left: 50px; width: 150px; overflow: hidden; display: none; cursor: move; outline: 2px solid #3b82f6; border-radius: 4px; z-index: 15; }
        #img-wrapper img { width: 100%; height: 100%; pointer-events: none; display: block; }
        
        #btn-eliminar-img { position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 14px; font-weight: bold; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 30; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #btn-eliminar-img:hover { background: #dc2626; }
        #img-wrapper:hover #btn-eliminar-img { display: flex; }

        #texto-arrastrable { position: absolute; top: 150px; left: 50px; font-size: 24px; color: var(--primary); display: none; cursor: move; min-width: 50px; outline: none; border-bottom: 2px dashed transparent; transition: border 0.2s; font-family: Arial, sans-serif; z-index: 20; }
        #texto-arrastrable:focus { border-bottom: 2px solid #3b82f6; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Editor Pro</h2>
        
        <div class="tool-group">
            <label>Documento Base</label>
            <input type="file" id="subir-pdf" accept="application/pdf">
        </div>

        <div class="tool-group">
            <label>Insertar Elementos</label>
            <input type="file" id="subir-img" accept="image/png, image/jpeg" style="margin-bottom: 5px;">
            <button id="btn-add-text">Añadir Texto</button>
            <button id="btn-add-parche">Borrar Texto (Corrector)</button>
        </div>

        <div class="tool-group">
            <label>Tamaño de Fuente (px)</label>
            <input type="number" id="input-fontsize" value="24">
        </div>

        <div class="tool-group">
            <label>Escalar Elementos (Visibles)</label>
            <div style="display: flex; gap: 10px;">
                <button id="btn-aumentar" style="flex: 1;">➕ Aumentar</button>
                <button id="btn-reducir" style="flex: 1;">➖ Reducir</button>
            </div>
        </div>

        <div class="tool-group">
            <label>Esquina de Redimensión</label>
            <button id="btn-lock-ratio" style="background: #eef2f5;">🔒 Proporción Bloqueada</button>
        </div>

        <div class="tool-group">
            <label>Extraer / Eliminar Páginas</label>
            <input type="text" id="input-eliminar" placeholder="Ej: 2, 4">
        </div>

        <div class="tool-group">
            <label>Sistema</label>
            <button id="btn-actualizar">Buscar Actualizaciones</button>
        </div>

        <button id="btn-guardar" class="btn-primary" style="display:none;">Exportar PDF</button>
    </div>

    <div class="main-content">
        <div class="toolbar-nav">
            <button id="btn-prev">←</button>
            <span style="font-size: 0.9rem; font-weight: 500;">
                Página <span id="page-num">0</span> / <span id="page-count">0</span>
            </span>
            <button id="btn-next">→</button>
        </div>

        <div id="contenedor-editor">
            <canvas id="pdf-canvas"></canvas>
            <div id="parche-blanco"></div>
            
            <div id="img-wrapper">
                <button id="btn-eliminar-img" title="Eliminar imagen">×</button>
                <img id="imagen-arrastrable" draggable="false">
            </div>
            
            <div id="texto-arrastrable" contenteditable="true">Haz clic para editar</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
